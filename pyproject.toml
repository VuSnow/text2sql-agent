[project]
name = "text2sql-agent"
version = "0.1.0"
description = "Text2SQL agent that converts natural language questions into PostgreSQL queries"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "sse-starlette==3.2.0",
    "langgraph==1.0.10",
    "langchain-core==1.4.0",
    "langchain-openai==1.1.10",
    "langchain-aws==1.5.0",
    "langsmith==0.7.6",
    "chromadb==1.5.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "pydantic-settings==2.13.1",
    "pyyaml==6.0.3",
    "fastmcp==2.10.1",
    "tenacity==9.1.4",
    "boto3==1.43.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
    "mypy==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
